[package]
name = "omnispot-rust"
version = "0.0.0"
edition = "2024"
publish = false

[[bin]]
name = "omnispot-rust"
path = "OmniSpot/App.rs"

[dependencies]
gpui = { version = "=0.2.2", default-features = false, features = ["windows-manifest"] }
windows = { version = "=0.61.3", features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Shell"] }
