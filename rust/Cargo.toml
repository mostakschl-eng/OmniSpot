[package]
name = "omnispot-rust"
version = "0.0.0"
edition = "2024"
publish = false

[[bin]]
name = "omnispot-rust"
path = "OmniSpot/App.rs"

[dependencies]
gpui = { version = "=0.2.2", default-features = false, features = ["windows-manifest"] }
raw-window-handle = "0.6.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
png = "0.17.16"
windows = { version = "=0.61.3", features = ["ApplicationModel", "ApplicationModel_Core", "Management_Deployment", "Win32_Foundation", "Win32_System_Com", "Win32_System_Threading", "Win32_System_LibraryLoader", "Win32_Storage_FileSystem", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi"] }
